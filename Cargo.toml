[workspace]
resolver = "3"
members = [
    "crates/brain-types",
    "crates/brain-store",
    "crates/brain-index",
    "crates/brain-app",
    "crates/brain-mcp",
    "crates/brain-tui",
    "crates/brain-cli",
    "crates/brain-orchestrator",
    "apps/brain-ide/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Avid <@codejunkie99>"]
repository = "https://github.com/codejunkie99/brain"
homepage = "https://github.com/codejunkie99/brain"
description = "git-backed memory layer for AI coding agents — MCP server, CLI, TUI"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.11", features = ["v7", "serde"] }
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs"] }
async-trait = "0.1"
fs2 = "0.4"
regex = "1.11"
once_cell = "1"
tempfile = "3"
insta = { version = "1", features = ["yaml", "json"] }
proptest = "1"

# Runtime-specific (pinned per the plan, versions verified against crates.io 2026-04-21)
git2 = { version = "0.20.4", features = ["vendored-openssl"] }
rusqlite = { version = "0.39", features = ["bundled"] }
rmcp = { version = "1.4", features = ["server", "macros", "transport-io"] }
clap = { version = "4.6", features = ["derive", "env"] }

# Orchestrator / IDE
petgraph = "0.6"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
tokio-stream = "0.1"
dashmap = "6"
parking_lot = "0.12"
keyring = "3"
dirs = "5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
