name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            binary: brain
          - os: macos-14
            target: aarch64-apple-darwin
            binary: brain

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustc --version
          cargo --version

      - name: Build release binary
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --locked --release --package brain-cli --bin brain --target ${{ matrix.target }}

      - name: Package binary
        run: |
          package_dir="dist/brain-${{ matrix.target }}"
          mkdir -p "$package_dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$package_dir/"
          cp README.md LICENSE CHANGELOG.md "$package_dir/"
          tar -czf "brain-${{ matrix.target }}.tar.gz" -C dist "brain-${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: brain-${{ matrix.target }}
          path: brain-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  github-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
