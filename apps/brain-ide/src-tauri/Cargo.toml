[package]
name = "brain-ide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Brain IDE — multi-agent orchestrator for Claude, Codex, and shell sessions, built on the brain memory layer."

[lib]
name = "brain_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
brain-types = { path = "../../../crates/brain-types" }
brain-store = { path = "../../../crates/brain-store" }
brain-index = { path = "../../../crates/brain-index" }
brain-orchestrator = { path = "../../../crates/brain-orchestrator" }

tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-clipboard-manager = "2"

serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time"] }
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
futures.workspace = true
tokio-stream.workspace = true
reqwest.workspace = true
keyring.workspace = true
dirs.workspace = true
regex.workspace = true
portable-pty.workspace = true
once_cell.workspace = true
base64 = "0.22"
walkdir = "2"
ignore = "0.4"
eventsource-stream = "0.2"
tokio-util = { version = "0.7", features = ["rt"] }
